[package]
name = "vega-torrent-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
anyhow = "1"
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
serde = { version = "1", features = ["rc", "derive"] }
serde_json = "1"
url = "2"
hex = "0.4"
libc = "0.2"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 1
debug = false
strip = "debuginfo"
