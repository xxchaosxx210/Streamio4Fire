[package]
name = "vega-torrent-probe"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
rolling-selftest = ["dep:ring"]

[[bin]]
name = "rolling-selftest"
path = "src/bin/rolling_selftest.rs"
required-features = ["rolling-selftest"]

[dependencies]
anyhow = "1"
ring = { version = "0.17", optional = true }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls", "http-api", "tracing-subscriber-utils"] }
librqbit-core = { version = "=5.0.0", default-features = false }
serde = { version = "1", features = ["rc", "derive"] }
serde_json = "1"
url = "2"
hex = "0.4"
libc = "0.2"
futures-core = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 1
debug = false
strip = "debuginfo"

[patch.crates-io]
librqbit = { path = "vendor/librqbit" }

[dev-dependencies]
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
